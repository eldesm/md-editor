name: Security audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate Content-Security-Policy
        if: always()
        run: node scripts/check-csp.mjs
      - name: Generate security status report
        if: always() && github.event_name != 'pull_request'
        run: node scripts/security-report.mjs
      - name: Commit security status report
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/security-status.md
          if git diff --staged --quiet; then
            echo "No changes to security-status.md"
          else
            git commit -m "Update security status report [skip ci]"
            git push
          fi
