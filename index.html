<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <link rel="icon" type="image/png" href="./icons/MD.png" />
    <link rel="apple-touch-icon" href="./icons/MD.png" />
    <title>md-editor</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="sidebar-toolbar">
          <button id="new-file-btn" type="button" disabled title="New note" aria-label="New note">
            <span class="btn-icon btn-icon-new-note"></span>
          </button>
          <button id="new-folder-btn" type="button" disabled title="New folder" aria-label="New folder">
            <span class="btn-icon btn-icon-new-folder"></span>
          </button>
          <button id="reveal-btn" type="button" disabled title="Reveal current file" aria-label="Reveal current file">
            <span class="btn-icon btn-icon-reveal"></span>
          </button>
          <button id="collapse-toggle-btn" type="button" disabled title="Expand all" aria-label="Expand all">
            <span class="btn-icon btn-icon-expand"></span>
          </button>
        </div>
        <div id="file-tree"></div>
        <div class="sidebar-footer">
          <button id="open-folder-btn" type="button" title="Open folder" aria-label="Open folder">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
              <path d="M2 4a1 1 0 0 1 1-1h3.5l1.5 1.5H13a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V4z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
            </svg>
            <span id="folder-name">No folder open</span>
          </button>
        </div>
      </aside>
      <main id="main">
        <header id="topbar">
          <button id="toggle-sidebar-btn" class="topbar-icon-btn" type="button" title="Toggle sidebar (⌘\)" aria-label="Toggle sidebar">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <rect x="2" y="3" width="12" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
              <line x1="6.2" y1="3" x2="6.2" y2="13" stroke="currentColor" stroke-width="1.3"/>
            </svg>
          </button>
          <nav id="breadcrumbs"></nav>
          <span id="save-status"></span>
          <button id="export-pdf-btn" class="topbar-icon-btn" type="button" disabled title="Export to PDF" aria-label="Export to PDF">
            <span class="btn-icon btn-icon-pdf"></span>
          </button>
        </header>
        <div id="editor"></div>
        <footer id="statusbar">
          <span id="word-count"></span>
          <div id="versions-wrapper">
            <button id="versions-btn" type="button" disabled title="Versions" aria-label="Versions">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
                <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.3"/>
                <path d="M8 5v3l2 1.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              </svg>
              <span id="versions-label">Versions</span>
            </button>
            <div id="versions-popover" hidden></div>
          </div>
        </footer>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
