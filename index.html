<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>md-editor</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="sidebar-toolbar">
          <button id="open-folder-btn" type="button" title="Open folder" aria-label="Open folder">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M2 4a1 1 0 0 1 1-1h3.5l1.5 1.5H13a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V4z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
            </svg>
          </button>
          <button id="new-file-btn" type="button" disabled title="New file" aria-label="New file">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M4 2h5l3 3v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
              <path d="M9 2v3h3" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
              <path d="M8 8v4M6 10h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
          </button>
          <button id="refresh-btn" type="button" disabled title="Refresh" aria-label="Refresh">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M3 8a5 5 0 0 1 8.5-3.5L13 6M13 3v3h-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M13 8a5 5 0 0 1-8.5 3.5L3 10M3 13v-3h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <div id="folder-name">No folder open</div>
        <div id="file-tree"></div>
      </aside>
      <main id="main">
        <header id="topbar">
          <button id="toggle-sidebar-btn" class="topbar-icon-btn" type="button" title="Toggle sidebar (⌘\)" aria-label="Toggle sidebar">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <rect x="2" y="3" width="12" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
              <line x1="6.2" y1="3" x2="6.2" y2="13" stroke="currentColor" stroke-width="1.3"/>
            </svg>
          </button>
          <nav id="breadcrumbs"></nav>
          <span id="save-status"></span>
          <button id="export-pdf-btn" class="topbar-icon-btn" type="button" disabled title="Export to PDF" aria-label="Export to PDF">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M4 2h5l3 3v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
              <path d="M9 2v3h3" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
              <path d="M8 8v4M6 11l2 2 2-2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </header>
        <div id="editor"></div>
        <footer id="statusbar">
          <span id="word-count"></span>
          <div id="versions-wrapper">
            <button id="versions-btn" type="button" disabled title="Versions" aria-label="Versions">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
                <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.3"/>
                <path d="M8 5v3l2 1.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              </svg>
              <span id="versions-label">Versions</span>
            </button>
            <div id="versions-popover" hidden></div>
          </div>
        </footer>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
